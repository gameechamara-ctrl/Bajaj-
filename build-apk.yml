name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK with Auto-Fix
        run: |
          if [ ! -f gradlew ]; then
            echo "Gradle wrapper සාදමින් පවතී..."
            gradle wrapper
          fi
          chmod +x gradlew
          
          # settings සහ build files වල ඇති ප්‍රශ්න auto-fix කරයි
          sed -i '/include(":app")/d' settings.gradle.kts || true
          sed -i '/include(":app")/d' settings.gradle || true
          sed -i 's/id("com.android.application")/id("com.android.application") version "8.2.2"/' build.gradle.kts || true
          sed -i 's/id '\''com.android.application'\''/id '\''com.android.application'\'' version '\''8.2.2'\''/' build.gradle || true
          
          ./gradlew build --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-connect-apk
          path: '**/build/outputs/apk/debug/*.apk'
